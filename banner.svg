<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="smallBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- soft glow accents -->
  <circle cx="140" cy="40" r="140" fill="#7c3aed" opacity="0.16" filter="url(#softBlur)"/>
  <circle cx="1120" cy="270" r="170" fill="#22d3ee" opacity="0.10" filter="url(#softBlur)"/>

  <!-- thin top/bottom accent lines -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#nameGrad)" opacity="0.9"/>

  <!-- === Left: text block === -->
  <text x="70" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#nameGrad)">Ekim Bolat</text>

  <text x="72" y="163" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#c9d1d9">Computer Engineering Student</text>
  <text x="72" y="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">Ege University</text>

  <!-- tag pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="72" y="215" width="192" height="34" rx="17" fill="#1c2333" stroke="#8b5cf6" stroke-opacity="0.5"/>
    <circle cx="92" cy="232" r="4" fill="#8b5cf6"/>
    <text x="105" y="237" fill="#c9d1d9">Backend Development</text>

    <rect x="278" y="215" width="150" height="34" rx="17" fill="#1c2333" stroke="#22d3ee" stroke-opacity="0.5"/>
    <circle cx="298" cy="232" r="4" fill="#22d3ee"/>
    <text x="311" y="237" fill="#c9d1d9">SAP Technologies</text>
  </g>

  <!-- === Right: cartoon-ish laptop illustration === -->
  <g transform="translate(850,60)">
    <!-- shadow -->
    <ellipse cx="150" cy="210" rx="150" ry="14" fill="#000000" opacity="0.35" filter="url(#smallBlur)"/>

    <!-- floating cloud -->
    <g transform="translate(10,-10)" opacity="0.95">
      <circle cx="20" cy="20" r="14" fill="#3b82f6"/>
      <circle cx="35" cy="14" r="18" fill="#3b82f6"/>
      <circle cx="52" cy="22" r="13" fill="#3b82f6"/>
      <rect x="8" y="20" width="56" height="16" rx="8" fill="#3b82f6"/>
    </g>

    <!-- floating gear -->
    <g transform="translate(255,20)">
      <g fill="#f59e0b">
        <rect x="14" y="-4" width="6" height="12" rx="2"/>
        <rect x="14" y="24" width="6" height="12" rx="2"/>
        <rect x="-4" y="14" width="12" height="6" rx="2"/>
        <rect x="24" y="14" width="12" height="6" rx="2"/>
        <rect x="2" y="2" width="6" height="12" rx="2" transform="rotate(45 5 8)"/>
        <rect x="24" y="2" width="6" height="12" rx="2" transform="rotate(-45 27 8)"/>
        <rect x="2" y="18" width="6" height="12" rx="2" transform="rotate(-45 5 24)"/>
        <rect x="24" y="18" width="6" height="12" rx="2" transform="rotate(45 27 24)"/>
      </g>
      <circle cx="17" cy="17" r="15" fill="#f59e0b"/>
      <circle cx="17" cy="17" r="7" fill="#111726"/>
    </g>

    <!-- database cylinder -->
    <g transform="translate(-30,150)">
      <ellipse cx="20" cy="6" rx="20" ry="7" fill="#34d399"/>
      <rect x="0" y="6" width="40" height="22" fill="#10b981"/>
      <ellipse cx="20" cy="28" rx="20" ry="7" fill="#10b981"/>
      <ellipse cx="20" cy="17" rx="20" ry="7" fill="none" stroke="#0b0f1a" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- connecting dashed lines -->
    <g stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.35" fill="none">
      <path d="M60,35 C100,50 120,70 150,90"/>
      <path d="M270,45 C240,70 220,80 195,95"/>
      <path d="M5,160 C60,140 90,130 130,115"/>
    </g>

    <!-- laptop body -->
    <g>
      <rect x="30" y="30" width="240" height="150" rx="14" fill="#161b22" stroke="url(#screenGlow)" stroke-width="2.5"/>
      <rect x="46" y="46" width="208" height="118" rx="4" fill="#0d1117"/>
      <!-- code lines -->
      <rect x="60" y="60" width="70" height="8" rx="4" fill="#8b5cf6" opacity="0.85"/>
      <rect x="60" y="76" width="110" height="8" rx="4" fill="#3b82f6" opacity="0.85"/>
      <rect x="60" y="92" width="90" height="8" rx="4" fill="#22d3ee" opacity="0.75"/>
      <rect x="60" y="108" width="130" height="8" rx="4" fill="#8b5cf6" opacity="0.55"/>
      <rect x="60" y="124" width="60" height="8" rx="4" fill="#3b82f6" opacity="0.7"/>
      <!-- code symbol -->
      <text x="170" y="150" font-family="'Cascadia Code','Consolas',monospace" font-size="26" font-weight="700" fill="url(#screenGlow)">&lt;/&gt;</text>
      <!-- keyboard base -->
      <path d="M10,180 L290,180 L275,200 Q270,206 260,206 L40,206 Q30,206 25,200 Z" fill="#21262d" stroke="#30363d"/>
      <rect x="130" y="184" width="40" height="6" rx="3" fill="#30363d"/>
    </g>
  </g>

  <rect x="0" y="297" width="1200" height="3" fill="url(#nameGrad)" opacity="0.9"/>
</svg>
