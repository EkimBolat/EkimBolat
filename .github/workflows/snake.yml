
Snake · YML
name: Generate Snake
 
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
 
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7c3aed&color_dots=#f3f4f6,#ddd6fe,#c4b5fd,#a78bfa,#8b5cf6
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8b5cf6&color_dots=#0d1117,#2d1b4e,#4c2889,#6d28d9,#8b5cf6
 
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 

