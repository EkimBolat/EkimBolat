name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#9B85D9&color_dots=#161B22,#4A3B6B,#6F5A9E,#9B85D9,#D6C9F5
            dist/github-contribution-grid-snake-dark.svg?color_snake=#9B85D9&color_dots=#161B22,#4A3B6B,#6F5A9E,#9B85D9,#D6C9F5
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
