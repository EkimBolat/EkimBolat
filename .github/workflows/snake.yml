name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=60a5fa,8b5cf6,c4b5fd,8b5cf6,60a5fa&color_dots=161b22,3b2f63,6d28d9,8b5cf6,c4b5fd
            dist/github-contribution-grid-snake-dark.svg?color_snake=60a5fa,8b5cf6,c4b5fd,8b5cf6,60a5fa&color_dots=0d1117,3b2f63,6d28d9,8b5cf6,c4b5fd

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
