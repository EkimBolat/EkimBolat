name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#A78BFA&color_dots=#161B22,#5D4A85,#8670C4,#A78BFA,#EDE6FB
            dist/github-contribution-grid-snake-dark.svg?color_snake=#A78BFA&color_dots=#161B22,#5D4A85,#8670C4,#A78BFA,#EDE6FB
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
