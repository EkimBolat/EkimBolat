name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00D4FF&color_dots=#0d1117,#7B2FF7,#FF2E63,#FF6B00,#FFD60A
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00D4FF&color_dots=#0d1117,#7B2FF7,#FF2E63,#FF6B00,#FFD60A
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
